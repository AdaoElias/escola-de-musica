<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <span class="login-logo">♪</span>
    <h1>Escola de Música</h1>
    <p class="sub">Defina uma nova senha</p>

    <form id="form-redefinir" class="form" hidden>
      <label>
        Nova senha
        <input type="password" id="senha" required minlength="6" autocomplete="new-password" placeholder="••••••••">
      </label>
      <label>
        Confirmar nova senha
        <input type="password" id="confirma" required minlength="6" autocomplete="new-password" placeholder="••••••••">
      </label>
      <p class="error" id="erro" role="alert"></p>
      <p class="sub" id="msg" style="min-height:1rem;"></p>
      <button type="submit" id="btn">Salvar senha</button>
    </form>

    <div id="aviso" class="sub" hidden>
      <p>Link inválido ou expirado.</p>
      <p><a href="/">Voltar ao login</a></p>
    </div>
  </main>

  <script type="module">
    import { getSupabase } from '/js/supabase.js';

    const form = document.getElementById('form-redefinir');
    const btn = document.getElementById('btn');
    const erro = document.getElementById('erro');
    const msg = document.getElementById('msg');
    const aviso = document.getElementById('aviso');

    const sb = await getSupabase();
    let pronto = false;

    function liberar() {
      if (pronto) return;
      pronto = true;
      aviso.hidden = true;
      form.hidden = false;
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN')) liberar();
    });

    const { data: { session } } = await sb.auth.getSession();
    if (session) liberar();

    setTimeout(() => {
      if (!pronto) {
        form.hidden = true;
        aviso.hidden = false;
      }
    }, 1500);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.textContent = '';
      const nova = document.getElementById('senha').value;
      const confirma = document.getElementById('confirma').value;
      if (nova.length < 6) {
        erro.textContent = 'A senha deve ter ao menos 6 caracteres.';
        return;
      }
      if (nova !== confirma) {
        erro.textContent = 'As senhas não conferem.';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Salvando…';
      const { error } = await sb.auth.updateUser({ password: nova });
      btn.disabled = false;
      btn.textContent = 'Salvar senha';
      if (error) {
        erro.textContent = error.message;
        return;
      }
      msg.textContent = 'Senha alterada! Redirecionando…';
      setTimeout(() => { window.location.href = '/app.html'; }, 1200);
    });
  </script>
</body>
</html>
