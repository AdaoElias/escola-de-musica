<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alunos — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app.html"><span class="brand-icon">♪</span> Escola de Música</a>
    <nav class="menu">
      <a href="/app.html">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html" class="ativo">Alunos</a>
      <a href="/turmas.html">Turmas</a>
      <a href="/matriculas.html">Matrículas</a>
      <a href="/grade.html">Grade</a>
      <a href="/aulas.html">Aulas</a>
      <a href="/financeiro.html">Financeiro</a>
      <a href="#" data-futuro>Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <div class="row">
      <h2>Alunos</h2>
      <button id="novo" class="btn">+ Novo aluno</button>
    </div>

    <div class="tabela-wrap">
      <table class="tabela">
        <thead>
          <tr><th>Nome</th><th>CPF</th><th>Nascimento</th><th>Telefone</th><th>E-mail</th><th>Cidade</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <dialog id="modal">
      <form id="form" class="form">
        <div class="modal-head">
          <h3 id="titulo-modal">Novo aluno</h3>
          <button type="button" class="x" data-fechar aria-label="Fechar">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id">
          <label class="field">Nome <span class="obrigatorio">*</span><input type="text" id="nome" required></label>
          <div class="grid2">
            <label class="field">CPF <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00"></label>
            <label class="field">Data de nascimento <input type="date" id="nascimento"></label>
          </div>
          <label class="field">Telefone <input type="tel" id="telefone" maxlength="15" placeholder="(11) 91234-5678"></label>
          <label class="field">E-mail <input type="email" id="email"></label>
          <label class="field">Observações <input type="text" id="observacao"></label>

          <div class="form-section" id="titulo-responsavel">Responsável (aluno menor de idade)</div>
          <div id="campo-responsavel">
            <label class="field">Nome do responsável <span class="obrigatorio" id="req-resp-nome">*</span><input type="text" id="responsavel_nome"></label>
            <div class="grid2">
              <label class="field">CPF do responsável <input type="text" id="responsavel_cpf" maxlength="14" placeholder="000.000.000-00"></label>
              <label class="field">Telefone do responsável <input type="tel" id="responsavel_telefone" maxlength="15" placeholder="(11) 91234-5678"></label>
            </div>
            <label class="field">Parentesco
              <select id="parentesco">
                <option value="pai">Pai</option>
                <option value="mae">Mãe</option>
                <option value="tutor">Tutor</option>
                <option value="outro">Outro</option>
              </select>
            </label>
          </div>

          <div class="form-section">Endereço</div>
          <div class="cep-row">
            <label class="field">CEP
              <input type="text" id="cep" maxlength="9" placeholder="00000-000">
            </label>
            <button type="button" class="btn ghost" id="buscar-cep">Buscar CEP</button>
          </div>
          <label class="field">Endereço <input type="text" id="endereco"></label>
          <div class="grid2">
            <label class="field">Bairro <input type="text" id="bairro"></label>
            <label class="field">Cidade <input type="text" id="cidade"></label>
          </div>

          <label class="check"><input type="checkbox" id="ativo" checked> Ativo</label>
        </div>
        <div class="modal-foot">
          <p class="error" id="erro"></p>
          <div class="row gap">
            <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
            <button type="submit" class="btn" id="btn-salvar">Salvar aluno</button>
          </div>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="/js/alunos.js"></script>
</body>
</html>
