<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alunos — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <strong>Escola de Música</strong>
    <nav class="menu">
      <a href="/app.html">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html" class="ativo">Alunos</a>
      <a href="/turmas.html">Turmas</a>
      <a href="/matriculas.html">Matrículas</a>
      <a href="#" data-futuro>Grade</a>
      <a href="#" data-futuro>Financeiro</a>
      <a href="#" data-futuro>Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <div class="row">
      <h2>Alunos</h2>
      <button id="novo" class="btn">+ Novo aluno</button>
    </div>

    <table class="tabela">
      <thead>
        <tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Status</th><th>Ações</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <dialog id="modal">
      <form id="form" class="form">
        <h3 id="titulo-modal">Novo aluno</h3>
        <input type="hidden" id="id">
        <label>Nome <input type="text" id="nome" required></label>
        <label>Telefone <input type="tel" id="telefone"></label>
        <label>E-mail <input type="email" id="email"></label>
        <label>Observações <input type="text" id="observacao"></label>
        <label class="check"><input type="checkbox" id="ativo" checked> Ativo</label>
        <div class="row gap">
          <button type="submit" class="btn">Salvar</button>
          <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
        </div>
        <p class="error" id="erro"></p>
      </form>
    </dialog>
  </main>

  <script type="module" src="/js/alunos.js"></script>
</body>
</html>
