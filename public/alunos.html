<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alunos — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app.html"><span class="brand-icon">♪</span> Escola de Música</a>
    <nav class="menu">
      <a href="/app.html">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html" class="ativo">Alunos</a>
      <a href="/turmas.html">Turmas</a>
      <a href="/matriculas.html">Matrículas</a>
      <a href="/grade.html">Grade</a>
      <a href="/aulas.html">Aulas</a>
      <a href="#" data-futuro>Financeiro</a>
      <a href="#" data-futuro>Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <div class="row">
      <h2>Alunos</h2>
      <button id="novo" class="btn">+ Novo aluno</button>
    </div>

    <div class="tabela-wrap">
      <table class="tabela">
        <thead>
          <tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <dialog id="modal">
      <form id="form" class="form">
        <div class="modal-head">
          <h3 id="titulo-modal">Novo aluno</h3>
          <button type="button" class="x" data-fechar aria-label="Fechar">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id">
          <label class="field">Nome <span class="obrigatorio">*</span><input type="text" id="nome" required></label>
          <label class="field">Telefone <input type="tel" id="telefone"></label>
          <label class="field">E-mail <input type="email" id="email"></label>
          <label class="field">Observações <input type="text" id="observacao"></label>
          <label class="check"><input type="checkbox" id="ativo" checked> Ativo</label>
        </div>
        <div class="modal-foot">
          <p class="error" id="erro"></p>
          <div class="row gap">
            <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
            <button type="submit" class="btn" id="btn-salvar">Salvar aluno</button>
          </div>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="/js/alunos.js"></script>
</body>
</html>
