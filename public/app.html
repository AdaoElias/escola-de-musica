<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <strong>Escola de Música</strong>
    <nav class="menu">
      <a href="/app.html" class="ativo">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html">Alunos</a>
      <a href="/turmas.html">Turmas</a>
      <a href="/matriculas.html">Matrículas</a>
      <a href="#" data-futuro>Grade</a>
      <a href="#" data-futuro>Financeiro</a>
      <a href="#" data-futuro>Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <h2 id="ola">Painel</h2>
    <div class="grid">
      <a class="tile" href="/professores.html"><strong>Professores</strong><span>Cadastro e lista</span></a>
      <a class="tile" href="/alunos.html"><strong>Alunos</strong><span>Cadastro e lista</span></a>
      <a class="tile" href="/turmas.html"><strong>Turmas</strong><span>Coletivas por professor</span></a>
      <a class="tile" href="/matriculas.html"><strong>Matrículas</strong><span>Turma ou individual</span></a>
      <div class="tile"><strong>Grade</strong><span>Próxima etapa</span></div>
      <div class="tile"><strong>Financeiro</strong><span>Próxima etapa</span></div>
      <div class="tile"><strong>Relatórios</strong><span>Próxima etapa</span></div>
    </div>
  </main>

  <script type="module">
    import { guard, logout, perfil } from '/js/auth.js';

    const sb = await guard();
    if (!sb) throw new Error('redirecionado');

    const user = await perfil(sb);
    document.getElementById('ola').textContent =
      'Bem-vindo(a), ' + (user ? user.nome : 'usuário');

    document.getElementById('sair').addEventListener('click', logout);

    for (const el of document.querySelectorAll('[data-futuro]')) {
      el.addEventListener('click', (e) => e.preventDefault());
    }
  </script>
</body>
</html>
