<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade de Conteúdos — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app.html"><span class="brand-icon">♪</span> Escola de Música</a>
    <nav class="menu">
      <a href="/app.html">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html">Alunos</a>
      <a href="/turmas.html">Turmas</a>
      <a href="/matriculas.html">Matrículas</a>
      <a href="/grade.html" class="ativo">Grade</a>
      <a href="/aulas.html">Aulas</a>
      <a href="#" data-futuro>Financeiro</a>
      <a href="#" data-futuro>Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <div class="row">
      <h2>Grade de Conteúdos</h2>
      <button id="novo" class="btn">+ Novo item</button>
    </div>

    <div class="tabela-wrap">
      <table class="tabela">
        <thead>
          <tr><th>Ordem</th><th>Título</th><th>Descrição</th><th>Módulo</th><th>Nível</th><th>Tempo</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <dialog id="modal">
      <form id="form" class="form">
        <div class="modal-head">
          <h3 id="titulo-modal">Novo item</h3>
          <button type="button" class="x" data-fechar aria-label="Fechar">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id">
          <div class="grid2">
            <label class="field">Ordem <input type="number" id="ordem" min="0" step="1"></label>
            <label class="field">Tempo estimado (min) <input type="number" id="tempo_estimado" min="0" step="1"></label>
          </div>
          <label class="field">Título <span class="obrigatorio">*</span><input type="text" id="titulo" required></label>
          <label class="field">Descrição <input type="text" id="descricao"></label>
          <div class="grid2">
            <label class="field">Módulo <input type="text" id="modulo" placeholder="Ex.: Módulo 1 - Fundamentos"></label>
            <label class="field">Nível
              <select id="nivel">
                <option value="Iniciante">Iniciante</option>
                <option value="Intermediário">Intermediário</option>
                <option value="Avançado">Avançado</option>
              </select>
            </label>
          </div>
          <label class="check">
            <input type="checkbox" id="ativo" checked> Ativo
          </label>
        </div>
        <div class="modal-foot">
          <p class="error" id="erro"></p>
          <div class="row gap">
            <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
            <button type="submit" class="btn" id="btn-salvar">Salvar item</button>
          </div>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="/js/grade.js"></script>
</body>
</html>
