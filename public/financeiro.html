<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app.html"><span class="brand-icon">♪</span> Escola de Música</a>
    <nav class="menu">
      <a href="/app.html">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html">Alunos</a>
      <a href="/turmas.html">Turmas</a>
      <a href="/matriculas.html">Matrículas</a>
      <a href="/grade.html">Grade</a>
      <a href="/aulas.html">Aulas</a>
      <a href="/financeiro.html" class="ativo">Financeiro</a>
      <a href="/relatorios.html">Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <div class="page-head">
      <div>
        <h2>Financeiro</h2>
        <p class="sub" id="resumo-mes"></p>
      </div>
      <div class="row gap" style="margin-bottom:0">
        <button id="gerar" class="btn ghost">Gerar mensalidades</button>
        <button id="novo" class="btn">+ Novo lançamento</button>
      </div>
    </div>

    <section class="kpis" id="kpis" aria-label="Indicadores financeiros"></section>

    <div class="row gap" style="align-items:flex-end; flex-wrap:wrap">
      <label class="field" style="margin-bottom:0; max-width:13rem">Status
        <select id="filtro-status">
          <option value="a_receber">A receber</option>
          <option value="paga">Recebidos</option>
          <option value="cancelada">Cancelados</option>
          <option value="todas">Todos</option>
        </select>
      </label>
      <label class="field" style="margin-bottom:0; max-width:13rem">Competência (mês)
        <input type="month" id="filtro-mes" placeholder="todos">
      </label>
      <p class="sub" id="total-lista" style="margin-left:auto"></p>
    </div>

    <div class="tabela-wrap">
      <table class="tabela">
        <thead>
          <tr><th>Aluno</th><th>Descrição</th><th>Competência</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <dialog id="modal-baixar">
      <form id="form-baixar" class="form">
        <div class="modal-head">
          <h3>Baixar pagamento</h3>
          <button type="button" class="x" data-fechar aria-label="Fechar">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="baixar-id">
          <p class="sub" id="baixar-resumo"></p>
          <div class="grid2">
            <label class="field">Data do pagamento <span class="obrigatorio">*</span>
              <input type="date" id="data_pagamento" required>
            </label>
            <label class="field">Forma de pagamento <span class="obrigatorio">*</span>
              <select id="forma_pagamento">
                <option value="pix">PIX</option>
                <option value="cartao">Cartão</option>
                <option value="dinheiro">Dinheiro</option>
                <option value="boleto">Boleto</option>
              </select>
            </label>
          </div>
        </div>
        <div class="modal-foot">
          <p class="error" id="erro-baixar"></p>
          <div class="row gap">
            <button type="button" class="btn ghost" id="cancelar-baixar">Cancelar</button>
            <button type="submit" class="btn" id="salvar-baixar">Confirmar pagamento</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="modal-lancar">
      <form id="form-lancar" class="form">
        <div class="modal-head">
          <h3>Novo lançamento</h3>
          <button type="button" class="x" data-fechar aria-label="Fechar">×</button>
        </div>
        <div class="modal-body">
          <label class="field">Aluno <span class="obrigatorio">*</span>
            <select id="aluno_id"></select>
          </label>
          <label class="field">Descrição <span class="obrigatorio">*</span>
            <input type="text" id="descricao" placeholder="Ex.: Taxa de inscrição, desconto, ajuste...">
          </label>
          <div class="grid2">
            <label class="field">Valor (R$) <span class="obrigatorio">*</span>
              <input type="number" id="valor" min="0" step="0.01" required>
            </label>
            <label class="field">Vencimento <span class="obrigatorio">*</span>
              <input type="date" id="vencimento" required>
            </label>
          </div>
          <div class="grid2">
            <label class="field">Competência (mês) <span class="obrigatorio">*</span>
              <input type="month" id="competencia" required>
            </label>
            <label class="field">Tipo
              <select id="tipo">
                <option value="ajuste">Ajuste manual</option>
                <option value="mensalidade">Mensalidade</option>
                <option value="aula_avulsa">Aula avulsa</option>
              </select>
            </label>
          </div>
        </div>
        <div class="modal-foot">
          <p class="error" id="erro-lancar"></p>
          <div class="row gap">
            <button type="button" class="btn ghost" id="cancelar-lancar">Cancelar</button>
            <button type="submit" class="btn" id="salvar-lancar">Salvar lançamento</button>
          </div>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="/js/financeiro.js"></script>
</body>
</html>
