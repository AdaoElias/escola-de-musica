<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turmas — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app.html"><span class="brand-icon">♪</span> Escola de Música</a>
    <nav class="menu">
      <a href="/app.html">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html">Alunos</a>
      <a href="/turmas.html" class="ativo">Turmas</a>
      <a href="/matriculas.html">Matrículas</a>
      <a href="/grade.html">Grade</a>
      <a href="/aulas.html">Aulas</a>
      <a href="/financeiro.html">Financeiro</a>
      <a href="/relatorios.html">Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <div class="row">
      <h2>Turmas</h2>
      <button id="novo" class="btn">+ Nova turma</button>
    </div>

    <div class="tabela-wrap">
      <table class="tabela" data-export="Turmas">
        <thead>
          <tr><th>Nome</th><th>Instrumento</th><th>Professor</th><th>Dia</th><th>Horário</th><th>Valor mensal</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <dialog id="modal">
      <form id="form" class="form">
        <div class="modal-head">
          <h3 id="titulo-modal">Nova turma</h3>
          <button type="button" class="x" data-fechar aria-label="Fechar">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id">
          <div class="grid2">
            <label class="field">Nome <span class="obrigatorio">*</span><input type="text" id="nome" required></label>
            <label class="field">Instrumento <input type="text" id="instrumento" list="lista-instrumentos" placeholder="Digite ou escolha da lista"></label>
          </div>
          <label class="field">Professor <select id="professor_id"></select></label>
          <div class="grid2">
            <label class="field">Dia da semana
              <select id="dia_semana">
                <option value="Segunda">Segunda</option>
                <option value="Terça">Terça</option>
                <option value="Quarta">Quarta</option>
                <option value="Quinta">Quinta</option>
                <option value="Sexta">Sexta</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
              </select>
            </label>
            <label class="field">Horário <input type="time" id="horario"></label>
          </div>
          <div class="grid2">
            <label class="field">Valor mensal (R$) <input type="number" id="valor_mensal" min="0" step="0.01"></label>
            <label class="field">Status
              <select id="status">
                <option value="ativa">Ativa</option>
                <option value="encerrada">Encerrada</option>
              </select>
            </label>
          </div>
        <datalist id="lista-instrumentos"></datalist>
        </div>
        <div class="modal-foot">
          <p class="error" id="erro"></p>
          <div class="row gap">
            <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
            <button type="submit" class="btn" id="btn-salvar">Salvar turma</button>
          </div>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="/js/turmas.js"></script>
  <script type="module" src="/js/senha.js"></script>
  <script type="module" src="/js/csv.js"></script>
</body>
</html>
