<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>Escola de Música</h1>
    <p class="sub">Acesse o sistema</p>

    <form id="login-form" class="form">
      <label>
        E-mail
        <input type="email" id="email" required autocomplete="username" placeholder="seu@email.com">
      </label>
      <label>
        Senha
        <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <p class="error" id="erro" role="alert"></p>
      <button type="submit" id="btn">Entrar</button>
    </form>
  </main>

  <script type="module">
    import { login } from '/js/auth.js';

    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn');
    const erro = document.getElementById('erro');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      const err = await login(
        document.getElementById('email').value.trim(),
        document.getElementById('senha').value
      );
      if (err) {
        erro.textContent = 'Erro: ' + (err.message || err.error_description || 'desconhecido') + ' (' + (err.status || '?') + ')';
        console.error('Login error:', err);
        btn.disabled = false;
        btn.textContent = 'Entrar';
      } else {
        window.location.href = '/app.html';
      }
    });
  </script>
</body>
</html>
