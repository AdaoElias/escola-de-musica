<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrículas — Escola de Música</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app.html"><span class="brand-icon">♪</span> Escola de Música</a>
    <nav class="menu">
      <a href="/app.html">Início</a>
      <a href="/professores.html">Professores</a>
      <a href="/alunos.html">Alunos</a>
      <a href="/turmas.html">Turmas</a>
      <a href="/matriculas.html" class="ativo">Matrículas</a>
      <a href="/grade.html">Grade</a>
      <a href="/aulas.html">Aulas</a>
      <a href="/financeiro.html">Financeiro</a>
      <a href="#" data-futuro>Relatórios</a>
    </nav>
    <button id="sair" class="link">Sair</button>
  </header>

  <main class="wrap">
    <div class="row">
      <h2>Matrículas</h2>
      <button id="novo" class="btn">+ Nova matrícula</button>
    </div>

    <div class="tabela-wrap">
      <table class="tabela">
        <thead>
          <tr><th>Aluno</th><th>Tipo</th><th>Turma / Professor</th><th>Pagamento</th><th>Valor</th><th>Status</th><th>Início</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <dialog id="modal">
      <form id="form" class="form">
        <div class="modal-head">
          <h3 id="titulo-modal">Nova matrícula</h3>
          <button type="button" class="x" data-fechar aria-label="Fechar">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id">
          <label class="field">Aluno <span class="obrigatorio">*</span><select id="aluno_id"></select></label>
          <div class="form-section">Vínculo</div>
          <div class="grid2">
            <label class="field">Tipo
              <select id="tipo">
                <option value="turma">Turma</option>
                <option value="individual">Individual</option>
              </select>
            </label>
            <label class="field">Pagamento
              <select id="tipo_pagamento">
                <option value="mensal">Mensal</option>
                <option value="avulsa">Avulsa (por aula)</option>
                <option value="parcelado">Parcelado (carnê 1/6/12x)</option>
              </select>
            </label>
          </div>
          <label class="field" id="campo-turma">Turma <span class="obrigatorio">*</span><select id="turma_id"></select></label>
          <label class="field" id="campo-professor" style="display:none">Professor <span class="obrigatorio">*</span><select id="professor_id"></select></label>

          <div class="form-section">Horário fixo (individual / Aluno VIP)</div>
          <div class="grid2" id="campo-horario" style="display:none">
            <label class="field">Dia da semana
              <select id="dia_semana">
                <option value="segunda">Segunda-feira</option>
                <option value="terca">Terça-feira</option>
                <option value="quarta">Quarta-feira</option>
                <option value="quinta">Quinta-feira</option>
                <option value="sexta">Sexta-feira</option>
                <option value="sabado">Sábado</option>
              </select>
            </label>
            <label class="field">Horário <input type="time" id="horario"></label>
          </div>

          <div class="form-section">Cobrança</div>
          <div class="grid2">
            <label class="field">Taxa de matrícula (R$, paga no ato) <input type="number" id="valor_matricula" min="0" step="0.01"></label>
            <label class="field">Forma de pagamento da matrícula
              <select id="matricula_forma_pagamento">
                <option value="pix">PIX</option>
                <option value="dinheiro">Dinheiro</option>
                <option value="cartao">Cartão</option>
                <option value="boleto">Boleto</option>
              </select>
            </label>
          </div>
          <div class="grid2">
            <label class="field" id="campo-valor-mensal" style="display:none">Valor mensal (R$) <input type="number" id="valor_mensal" min="0" step="0.01"></label>
            <label class="field" id="campo-valor-total" style="display:none">Valor do curso (R$) <input type="number" id="valor_total" min="0" step="0.01"></label>
            <label class="field" id="campo-valor-aula" style="display:none">Valor por aula (R$) <input type="number" id="valor_aula" min="0" step="0.01"></label>
          </div>
          <div class="field" id="campo-parcelas" style="display:none">Parcelas <span class="obrigatorio">*</span>
            <div class="row gap">
              <label class="check"><input type="radio" name="parcelas" value="1"> 1x</label>
              <label class="check"><input type="radio" name="parcelas" value="6"> 6x</label>
              <label class="check"><input type="radio" name="parcelas" value="12" checked> 12x</label>
            </div>
          </div>
          <label class="field">Dia do vencimento (dia fixo, 1 a 28) <input type="number" id="dia_vencimento" min="1" max="28" value="5"></label>
          <div class="form-section">Situação</div>
          <div class="grid2">
            <label class="field">Status
              <select id="status_matricula">
                <option value="ativa">Ativa</option>
                <option value="trancada">Trancada</option>
                <option value="concluida">Concluída</option>
              </select>
            </label>
            <label class="field">Data de início <input type="date" id="data_inicio"></label>
          </div>
        </div>
        <div class="modal-foot">
          <p class="error" id="erro"></p>
          <div class="row gap">
            <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
            <button type="submit" class="btn" id="btn-salvar">Salvar matrícula</button>
          </div>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="/js/matriculas.js"></script>
</body>
</html>
